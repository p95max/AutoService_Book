{% extends "base.html" %}
{% load i18n %}
{% block content %}
<div class="container mt-5 text-center">
  <h2>{% trans "Sign in via Google" %}</h2>
  <p>{% trans "You are about to sign in using your Google account." %}</p>

  <form method="post" action="">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger mt-3">
      <i class="bi bi-google"></i>{% trans "Continue with Google" %}
    </button>
  </form>
</div>
{% endblock %}
