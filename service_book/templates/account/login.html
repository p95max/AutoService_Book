{% extends 'base.html' %}
{% load crispy_forms_filters %}
{% load socialaccount %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="container mt-5">
  <h3 class="text-center mb-4">User Authorisation</h3>

  <div class="container d-flex justify-content-center">
    <form method="post" class="w-50">
      {% csrf_token %}
      {{ form|crispy }}
      <button type="submit" class="btn btn-primary w-100 mt-3">Login</button>
    </form>
  </div><br>

    <span class="d-block text-center my-3">--- or ---</span>


  <div class="d-flex justify-content-center mb-3">
    <a href="{% provider_login_url 'google' %}" class="btn btn-outline-danger">
      <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google logo" style="width:20px; margin-right:8px;">
          Signup by Google
    </a>
  </div>

</div>
{% endblock %}
