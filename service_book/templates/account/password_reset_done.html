{% extends 'base.html' %}
{% load crispy_forms_filters %}
{% load i18n %}

{% block title %}{% trans "Request sent" %}{% endblock %}

{% block content %}
    <h3>{% trans "Request sent" %}</h3>
    <h4>{% trans "Please, check your Email" %}</h4>

<div class="container d-flex justify-content-center mt-5">
  <form method="post" class="w-50">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">{% trans "Next step" %}</button>
  </form>
</div>
{% endblock %}
