{% extends 'base.html' %}
{% load crispy_forms_filters %}
{% load i18n %}

{% block title %}{% trans "New password confirmed" %}{% endblock %}

{% block content %}
    <h3>{% trans "Success! New password confirmed!" %}</h3>

<div class="container d-flex justify-content-center mt-5">
  <form method="post" class="w-50">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">{% trans "Next" %}</button>
  </form>
</div>
{% endblock %}
