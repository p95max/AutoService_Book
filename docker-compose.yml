services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h localhost || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    environment:
      DJANGO_SETTINGS_MODULE: autoservice_book.settings
      DJANGO_WSGI_MODULE: autoservice_book.wsgi
      GUNICORN_LOGLEVEL: info
      FIXTURE_BRANDS: /app/service_book/fixtures/brands.json

    command: >
      gunicorn ${DJANGO_WSGI_MODULE:-autoservice_book.wsgi}:application
      --bind 0.0.0.0:8000
      --workers 3
      --access-logfile -
      --error-logfile -
      --log-level ${GUNICORN_LOGLEVEL:-info}

    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:stable
    ports:
      - "80:80"
    volumes:
      - static_volume:/usr/share/nginx/html/static:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - web

volumes:
  db_data:
  static_volume:
